        <div class="tictactoe__item" data-row="1" data-cell="2"></div>
        <div class="tictactoe__item" data-row="2" data-cell="0"></div>
        <div class="tictactoe__item" data-row="2" data-cell="1"></div>
        <div class="tictactoe__item" data-row="2" data-cell="2"></div>

    <script src="script.js"></script>
